id: strict-model-only
language: python
severity: error
message: Only strict_model.StrictModel sets model config. A subclass that overrides it could allow unknown fields in a research artifact.
files:
  - src/**/*.py
  - scripts/**/*.py
  - evals/**/*.py
ignores:
  - src/agentic_research_loop/strict_model.py
rule:
  any:
    - kind: assignment
      has: {field: left, regex: ^model_config$}
    - kind: keyword_argument
      has: {field: name, regex: ^extra$}
      inside:
        kind: argument_list
        inside: {kind: class_definition}
