[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fact-finder"
version = "0.1.0"
description = "Research kit for bounded investigations run inside a native agent goal"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Adam Thuvesen" }]
keywords = ["agents", "research", "autonomous", "investigation", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "google-auth[requests]>=2.20",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "sqlglot>=30.29.0",
    "tomlkit>=0.15.2",
]

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "ast-grep-cli>=0.51.1",
    "basedpyright==1.40.2",
    "deptry>=0.25.1",
    "import-linter>=2.15",
    "markdown-it-py>=4.2.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.0.0",
    "pytest>=8.2",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff==0.17.4",
    "types-pyyaml>=6.0.12.20261103",
    "vulture>=2.16",
    "zizmor>=1.32.0",
]

[project.scripts]
research = "fact_finder.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
addopts = ["--strict-markers"]

[tool.hatch.build.targets.wheel]
packages = ["src/fact_finder"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["vulture_whitelist.py"]
# The verify driver is a Python script with no file extension.
extend-include = [".agents/skills/*/verify"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "BLE", "TRY", "PTH", "TID", "ANN", "PL", "RUF", "C4", "DTZ", "T20", "ARG", "ERA", "PERF", "FBT", "SLF", "RET", "PGH", "PGH003"]
ignore = [
    "E501",
    "TRY003",
    "PLR2004",
    "PLR0913",
    "ANN401",
]

