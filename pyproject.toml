[tool.ruff.lint.per-file-ignores]
# The CLI's job is to print.
"src/fact_finder/cli.py" = ["T201"]
# The verify driver runs the real CLI and prints its evidence path.
".agents/skills/*/verify" = ["S603", "S607", "TID251", "T20", "FBT"]
# This script probes installed clients on purpose, with fixed arguments.
"scripts/check_agent_setup.py" = ["S603", "TID251"]
"src/fact_finder/strict_model.py" = ["TID251"]
"tests/**" = ["S101", "PLR0917", "S603", "S607", "ANN", "ARG", "PLC0415", "SLF001", "FBT", "T20", "TRY", "PTH123", "S105", "S108", "TID251"]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
venvPath = "."
venv = ".venv"
include = ["."]
failOnWarnings = false
exclude = ["**/.venv", "**/__pycache__", "research", "examples", "vulture_whitelist.py"]
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportMissingParameterType = false
reportPrivateUsage = false

[tool.vulture]
paths = ["src", "scripts", "vulture_whitelist.py"]
min_confidence = 60
ignore_names = ["cls", "model_config"]
ignore_decorators = ["@field_validator", "@model_validator"]

[tool.deptry]
extend_exclude = ["experiments", "examples", "evals", "bench"]
known_first_party = ["fact_finder"]

[tool.coverage.run]
source = ["fact_finder"]

[tool.coverage.report]
precision = 2

[tool.uv]
# A user-level `only-managed` makes uv rebuild `.venv` when it was built under another
# XDG_DATA_HOME, because uv keeps its managed Python there. This value accepts the existing `.venv`.
python-preference = "managed"

[tool.fact-finder]
sources_dir = "src/fact_finder/bundles"

[tool.importlinter]
root_package = "fact_finder"

[[tool.importlinter.contracts]]
name = "cli above domain above I/O; nothing imports cli. Fix: move the import or the code down a layer; the layers are listed in pyproject.toml"
type = "layers"
containers = ["fact_finder"]
exhaustive = true
layers = [
    "__main__",
    "cli",
    "next_step | lint | repo_setup",
    "research | validation | doctor",
    "source_bundles | agent_hooks",
    "evidence | client_configs | templates | from_spec",
    "sources | readonly_sql",
    "strict_model",
    "layout",
    "io | google_api | feedback",
]
