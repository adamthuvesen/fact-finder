[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-research-loop"
version = "0.1.0"
description = "Research kit for bounded investigations run inside a native agent goal"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Adam Thuvesen" }]
keywords = ["agents", "research", "autonomous", "investigation", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["google-auth[requests]>=2.20"]

[dependency-groups]
dev = ["actionlint-py>=1.7.12.25", "ast-grep-cli>=0.51.1", "basedpyright>=1.40.2", "deptry>=0.25.1", "import-linter>=2.15", "pip-audit>=2.10.1", "pre-commit>=4.0.0", "pytest>=8.2", "pytest-cov>=7.1.0", "ruff>=0.9", "vulture>=2.16", "zizmor>=1.32.0"]

[project.scripts]
research = "agentic_research_loop.cli:_entry"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_research_loop"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "BLE", "TRY", "PTH", "TID", "ANN", "PL", "RUF", "C4", "DTZ", "T20", "ARG", "ERA", "PERF", "FBT", "SLF", "RET", "PGH"]
ignore = [
    "E501",
    "TRY003",
    "PLR2004",
    "PLR0913",
    "ANN401",
    # Ratchet: existing findings. Remove each code once its findings are gone.
    "B011",
    "DTZ011",
    "ERA001",
    "FBT003",
    "PLC0415",
    "PLR0912",
    "PLR0915",
    "PLW0603",
    "PTH105",
    "PTH108",
    "PTH201",
    "RUF005",
    "S105",
    "S310",
    "S603",
    "SIM105",
    "SIM117",
    "T201",
    "TRY004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "ANN", "ARG", "PLC0415", "SLF001", "FBT", "T20", "TRY", "PTH123"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
failOnWarnings = false
strict = ["src"]
exclude = ["**/.venv", "**/__pycache__", "research", "evals", "examples"]

[tool.vulture]
paths = ["src"]
min_confidence = 80
ignore_names = ["cls"]

[tool.deptry]
extend_exclude = ["experiments", "examples", "evals", "bench"]

[tool.coverage.run]
source = ["agentic_research_loop"]
