setup = """
**Transport:** `cli` - the `research gsc` subcommand, not an MCP server. This is an
**MCP-less bundle**: it has no server, so enabling it
registers the source for planning and prompting but wires no server into the MCP
configs.

**Read-only enforcement (`scope:webmasters.readonly`):** the CLI authenticates with
the **`webmasters.readonly` OAuth scope**, which grants read access to Search
Analytics and nothing that can modify a property. Read-only is enforced by the
**scope** on the credential, not by a config flag.

## Default path: the warehouse, not this CLI

Prefer a **warehouse-synced copy** of GSC (Snowflake or BigQuery, via Fivetran or
the GSC bulk export) for organic-search metrics - query the semantic views / marts
or synced staging tables. The `research gsc` CLI is the **API fallback**: reach for
it only when the sync is lagging, you need fresher data, or you want an API-only
slice.

1. Run `uv run research source enable gsc`. No MCP config changes: there is no server.
2. Authenticate with Application Default Credentials, requesting the read-only
   scope (`agentic_research_loop.google_api` picks ADC up automatically):

   ```bash
   gcloud auth application-default login \\
     --scopes="https://www.googleapis.com/auth/webmasters.readonly,https://www.googleapis.com/auth/cloud-platform"
   ```

   Search Console is not covered by `gcloud`'s built-in client, so if that login
   is rejected you need your own OAuth client: in a GCP project, enable the
   **Google Search Console API**, create an **OAuth 2.0 Client ID** of type
   *Desktop app*, download the JSON, and pass it with
   `--client-id-file=/path/to/your-oauth-client.json`.

3. Configure the site. There is no default. Set `GSC_SITE`, or `gsc_site` under
   `[tool.agentic-research-loop]` in `pyproject.toml`, to the verified Search Console
   property URL (e.g. `https://www.example.com/` or `sc-domain:example.com`). The
   environment variable wins. Also set:
   - `GCP_QUOTA_PROJECT` - optional; a GCP project to bill the API quota to.

## Use

```bash
research gsc --start-date 2026-03-01 --end-date 2026-04-06 --dimensions query,page
```

- Dimensions: `query`, `page`, `country`, `device`, `searchAppearance`, `date`.
- `--row-limit` and `--start-row` paginate.
- `--start-date` / `--end-date` are validated locally as real `YYYY-MM-DD` dates,
  and inverted ranges are rejected before any API call.
"""

[source]
display_name = "GSC"
category = "product-analytics"
transport = "cli"
plan_line = "GSC organic search — default warehouse (Snowflake or BigQuery, synced); `research gsc` only as API fallback."
notes = "Google Search Console data for organic search performance — clicks, impressions, CTR, positions by query, page, device, country, and date. Read-only.\n**Default:** a warehouse-synced copy (Snowflake or BigQuery, via Fivetran or the GSC bulk export); prefer semantic views / marts when they cover the question, else the synced staging tables, e.g. a keyword+page report (query + page + country + device + date) and a page report (page + country + device + date, no query dimension).\n**Fallback:** `research gsc` CLI for fresher data, when sync is lagging, or for API-only slices.\n  Example: research gsc --start-date 2026-03-01 --end-date 2026-04-06 --dimensions query,page\n  Dimensions: query, page, country, device, searchAppearance, date\n  Supports --row-limit and --start-row for pagination."

[source.read_only_control]
mechanism = "credential_scope"
detail = "webmasters.readonly"
